<script>
/* WAGBi STACKER — ON BASE. 320x180 timing stacker.
   Drop the Base mark. Overhang is sliced. Miss the block and the site closes.
   Cat sprite is assets/doji.png, drawn 1:1 nearest-neighbor, mirrored horizontally so he faces the load. Never redrawn.
   Stacked blocks are the Base square from wagbi-build/make_wagbi.py (crane_load), assets/base.png, nearest-neighbor. */
(() => {
'use strict';
const W = 320, H = 180;
const BH = 16, GAP = 22, STACK_SCREEN = 92;
const START_W = 16, PAD_W = 46, PAD_H = 12;
const GANTRY_Y = 30, PERFECT_TOL = 2;
const BEST_KEY = 'wagbiStacker.best';
const A = window.WAGBI_ASSETS || {};
const QS = new URLSearchParams(location.search);
const SHOT = QS.get('shot');

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

const img = {};
function loadAll(cb) {
  const keys = Object.keys(A);
  let left = keys.length;
  if (!left) { cb(); return; }
  keys.forEach(k => {
    const i = new Image();
    i.onload = () => { if (--left === 0) cb(); };
    i.onerror = () => { if (--left === 0) cb(); };
    i.src = A[k];
    img[k] = i;
  });
}

const tintCache = {};
function fontFor(col) {
  if (tintCache[col]) return tintCache[col];
  const c = document.createElement('canvas');
  c.width = img.font.width; c.height = 8;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.drawImage(img.font, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = col;
  x.fillRect(0, 0, c.width, 8);
  return (tintCache[col] = c);
}
function text(s, x, y, col, shadow, align, scale) {
  if (!img.font) return;
  s = String(s);
  scale = scale || 1;
  const cw = 8 * scale;
  if (align === 'center') x = Math.round(x - s.length * cw / 2);
  else if (align === 'right') x = Math.round(x - s.length * cw);
  else x = Math.round(x);
  y = Math.round(y);
  const sh = shadow ? Math.max(1, scale) : 0;
  const draw = (f, ox, oy) => {
    for (let i = 0; i < s.length; i++) {
      const k = s.charCodeAt(i) - 32;
      if (k > 0 && k < 95) ctx.drawImage(f, k * 8, 0, 8, 8, x + i * cw + ox, y + oy, cw, 8 * scale);
    }
  };
  if (shadow) draw(fontFor(shadow), sh, sh);
  draw(fontFor(col), 0, 0);
}
function px(x, y, w, h, c) {
  if (w <= 0 || h <= 0) return;
  ctx.fillStyle = c;
  ctx.fillRect(x | 0, y | 0, w | 0, h | 0);
}
function fillRound(x, y, w, h, r, col) {
  x |= 0; y |= 0; w |= 0; h |= 0;
  if (w <= 0 || h <= 0) return;
  r = Math.max(0, Math.min(r | 0, (w / 2) | 0, (h / 2) | 0));
  ctx.fillStyle = col;
  if (r <= 1) { ctx.fillRect(x + (r ? 1 : 0), y, w - (r ? 2 : 0), h); ctx.fillRect(x, y + (r ? 1 : 0), w, h - (r ? 2 : 0)); return; }
  ctx.fillRect(x + r, y, w - 2 * r, h);
  ctx.fillRect(x, y + r, w, h - 2 * r);
  for (let i = 0; i < r; i++) {
    const dy = r - i - 0.5;
    const span = r - Math.ceil(r - Math.sqrt(Math.max(0, r * r - dy * dy)));
    if (span <= 0) continue;
    ctx.fillRect(x + (r - span), y + i, span, 1);
    ctx.fillRect(x + w - r, y + i, span, 1);
    ctx.fillRect(x + (r - span), y + h - 1 - i, span, 1);
    ctx.fillRect(x + w - r, y + h - 1 - i, span, 1);
  }
}

let seed = 0x57A6B1;
function rnd() {
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

let actx = null, muted = false, master = null, musicT = 0, stepN = 0, musicOn = false, noiseBuf = null;
const MASTER_VOL = 0.42;
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!actx) {
    try {
      actx = new AC();
      master = actx.createGain();
      master.gain.value = muted ? 0 : MASTER_VOL;
      master.connect(actx.destination);
      const b = actx.createBuffer(1, 1, actx.sampleRate || 22050);
      const src = actx.createBufferSource();
      src.buffer = b; src.connect(master); src.start(0);
    } catch (e) { actx = null; return null; }
  }
  if (actx.state === 'suspended' || actx.state === 'interrupted') {
    const r = actx.resume();
    if (r && r.catch) r.catch(() => {});
  }
  if (master) master.gain.value = muted ? 0 : MASTER_VOL;
  return actx;
}
function tone(freq, when, dur, type, vol) {
  if (!actx || muted || !master || dur <= 0) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(30, freq), when);
  g.gain.setValueAtTime(Math.max(0.0001, vol), when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(master);
  o.start(when); o.stop(when + dur + 0.02);
}
function noiseBuffer() {
  if (noiseBuf || !actx) return noiseBuf;
  const len = Math.floor(actx.sampleRate * 0.35);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return (noiseBuf = buf);
}
function noise(when, dur, vol, hp) {
  if (!actx || muted || !master || dur <= 0) return;
  const src = actx.createBufferSource();
  src.buffer = noiseBuffer();
  const f = actx.createBiquadFilter();
  f.type = hp > 2000 ? 'highpass' : 'lowpass';
  f.frequency.setValueAtTime(hp, when);
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(when); src.stop(when + dur + 0.02);
}
function kick(t) {
  if (!actx || muted || !master) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(170, t);
  o.frequency.exponentialRampToValueAtTime(48, t + 0.12);
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.18);
}
function musicTick() {
  if (!actx) return;
  if (master) master.gain.value = muted ? 0 : MASTER_VOL;
  if (muted || actx.state !== 'running') { musicOn = false; return; }
  const step = 60 / 104 / 4;
  if (!musicOn) { musicOn = true; musicT = actx.currentTime + 0.05; stepN = 0; }
  if (musicT < actx.currentTime - 0.15) musicT = actx.currentTime;
  const bass = [55, 55, 82.4, 73.4, 49, 55, 65.4, 73.4];
  let n = 0;
  while (musicT < actx.currentTime + 0.25 && n < 8) {
    const i = stepN % 16, t = musicT;
    if (i % 4 === 0) kick(t);
    if (i % 2 === 0) noise(t, 0.04, 0.18, 7000);
    if (i % 4 === 2) noise(t, 0.03, 0.1, 4000);
    if (i % 4 === 0) tone(bass[(i >> 2) % 8], t, step * 3.2, 'square', 0.16);
    if (i % 8 === 4) tone(440, t, step * 2, 'square', 0.05);
    stepN++; musicT += step; n++;
  }
}
const sfx = {
  tap() { if (!actx) return; tone(880, actx.currentTime, 0.05, 'square', 0.22); },
  drop() { if (!actx) return; noise(actx.currentTime, 0.06, 0.28, 1800); tone(320, actx.currentTime, 0.07, 'square', 0.18); },
  land() { if (!actx) return; const t = actx.currentTime; tone(523, t, 0.07, 'square', 0.28); tone(784, t + 0.04, 0.08, 'square', 0.2); },
  slice() { if (!actx) return; noise(actx.currentTime, 0.09, 0.32, 2400); },
  perfect() {
    if (!actx) return;
    const t = actx.currentTime;

    };
    board.hidden = false;
    ensureFont().then(() => { if (gen === paintGen) paint(); });
  };
  const readJson = async (r) => { try { return JSON.parse(await r.text()); } catch (_) { return {}; } };
  let seq = 0;
  async function refresh(note) {
    const run = ++seq;
    const data = initData();
    const headers = data ? { "X-Telegram-Init-Data": data } : {};
    if (!data && VerseBoard.launchToken()) headers["X-Verse-Launch-Token"] = VerseBoard.launchToken();
    try {
      const r = await fetch(api("/api/verse-leaderboard?game=wagbi"), { headers, cache: "no-store" });
      if (!r.ok) throw new Error("http " + r.status);
      const d = await readJson(r);
      if (run !== seq) return;
      try { if (d.weekly && d.weekly.player) sessionStorage.setItem("verse_wb_wagbi", String(d.weekly.player.best)); } catch (_) {}
      const idle = "";
      show(d, note || idle);
    } catch (_) {
      if (run === seq) show({}, note || "Leaderboard offline");
    }
  }
  window.addEventListener("wagbi:leaderboard-open", () => {
    if (!board.hidden) { board.hidden = true; return; }
    show(last ? { all_time: { top10: last.all, player: last.youAll }, weekly: { top10: last.week, player: last.youWeek } } : {}, "Loading...");
    refresh();
  });
  const pickTab = (which) => (e) => {
    e.preventDefault();
    e.stopPropagation();
    view = which;
    if (last) { paintGen++; paint(); }
  };
  tabAll.addEventListener("pointerdown", pickTab("all"));
  tabWeek.addEventListener("pointerdown", pickTab("week"));
  window.addEventListener("wagbi:gameover", (ev) => {
    const detail = ev.detail || {};
    const run = ++seq;
    const result = VerseBoard.finish({ game: "wagbi", score: detail.score,
      ms: detail.ms, previousBest: detail.previousBest });
    window.WAGBI_RESULT = result;
    result.done.then(() => {
      if (run !== seq || board.hidden) return;
      show(result.board || {}, result.line);
    });
  });
  const stop = (e) => { e.stopPropagation(); };
  const lbBtn = document.getElementById("wlb");
  lbBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    window.dispatchEvent(new CustomEvent("wagbi:leaderboard-open"));
  });
  document.getElementById("wboard-x").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    board.hidden = true;
  });
  board.addEventListener("pointerdown", stop);
  ["pointerup", "touchstart", "touchend", "click"].forEach((t) => board.addEventListener(t, stop));
  window.addEventListener("keydown", (e) => {
    if (e.code === "Escape" && !board.hidden) board.hidden = true;
  });
  addEventListener("resize", () => { if (!board.hidden && last) paint(); });
})();
</script>
</body>
</html>
