<script>
/* HOLM Coin Run - $HOLM on Base (@HolmOnBase) - WE COME HOLM. Native 320x180, pixelated. */

// ------------------------------------------------------------------ rng

// ------------------------------------------------------------------ input
const keys = {}; let jumpPressed = false, anyPressed = false;
let lastKey = null, tapAt = null, boardKey = false;   // one-frame input edges for menus
const LEFT = ['ArrowLeft', 'KeyA'], RIGHT = ['ArrowRight', 'KeyD'], JUMP = ['Space', 'ArrowUp', 'KeyW', 'KeyZ', 'KeyK'];
const touch = { left: false, right: false, jump: false };
addEventListener('keydown', e => {
  initAudio();

addEventListener('blur', () => { for (const k in keys) keys[k] = false; touch.left = touch.right = touch.jump = false; if (state === 'play') paused = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });
const held = list => list.some(k => keys[k]);
function bindBtn(id, name) {
  const el = document.getElementById(id); if (!el) return;
  const on = e => { e.preventDefault(); initAudio(); try { el.setPointerCapture(e.pointerId); } catch (_) {} touch[name] = true; el.classList.add('on'); if (name === 'jump') jumpPressed = true; anyPressed = true; lastKey = name === 'left' ? 'ArrowLeft' : name === 'right' ? 'ArrowRight' : 'Space'; };
  const off = e => { e.preventDefault(); touch[name] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
  el.addEventListener('contextmenu', e => e.preventDefault());

bindBtn('bl', 'left'); bindBtn('br', 'right'); bindBtn('bj', 'jump');
cv.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); const r = cv.getBoundingClientRect(); tapAt = { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; anyPressed = true; if (state === 'play' && paused) paused = false; });
const muteBtn = document.getElementById('bm');
if (muteBtn) muteBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); initAudio(); muted = !muted; muteBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON'; });
if (('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer: coarse)').matches)) document.body.classList.add('touch');
addEventListener('touchstart', () => document.body.classList.add('touch'), { once: true, passive: true });

// ------------------------------------------------------------------ layout (pixel-crisp scale to fit)
function resize() {
  const vw = innerWidth, vh = innerHeight;
  let s = Math.min(vw / W, vh / H);
  if (s >= 2 && Math.floor(s) / s > 0.84) s = Math.floor(s);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', resize); resize();

// ------------------------------------------------------------------ best score
const BEST_KEY = 'holmCoinRun.best';
let best = 0; try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (_) {}
function saveBest() { try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) {} }

// ------------------------------------------------------------------ leaderboard (data is pushed in by the host page; the game never fetches)
// window.holmSetLeaderboard({ top:[{name,score,rank?,me?}], you:{rank,best}|null, week:[...], weekYou:{rank,best}|null,
//                             status:'loading'|'ok'|'practice'|'error', message:'short text' })   - every field optional, merged.
// Until the host calls it at least once the game shows its classic game-over screen and no leaderboard button.
// The game emits window 'holm:leaderboard-open' when the player opens the board (host may refresh then).
const LB_STATUS = ['loading', 'ok', 'practice', 'error'];
const lb = { enabled: false, status: 'loading', message: '', top: [], week: [], you: null, weekYou: null, pending: false };
const ascii = s => String(s == null ? '' : s).replace(/[^\x20-\x7e]/g, '').replace(/\s+/g, ' ').trim();
function lbRows(a) {
  if (!Array.isArray(a)) return [];
  return a.slice(0, 10).map((r, i) => ({ rank: Math.max(1, parseInt(r && r.rank, 10) || i + 1), name: ascii(r && r.name) || 'PLAYER', score: Math.max(0, parseInt(r && r.score, 10) || 0), me: !!(r && r.me) }));
}
function lbYou(y) {

  const rank = parseInt(y.rank, 10) || 0, b = parseInt(y.best != null ? y.best : y.score, 10) || 0;
  return rank > 0 || b > 0 ? { rank, best: b } : null;
}
function setLeaderboard(d) {
  if (!d || typeof d !== 'object') return false;
  lb.enabled = true; lb.pending = false;
  if ('top' in d) lb.top = lbRows(d.top);
  if ('week' in d) lb.week = lbRows(d.week);
  if ('you' in d) lb.you = lbYou(d.you);
  if ('weekYou' in d) lb.weekYou = lbYou(d.weekYou);
  lb.status = LB_STATUS.includes(d.status) ? d.status : (('top' in d || 'week' in d) ? 'ok' : lb.status);
  lb.message = ascii(String(d.message == null ? '' : d.message).replace(/\n/g, '|')).toUpperCase().slice(0, 45);   // '|' or \n = line break

window.holmSetLeaderboard = setLeaderboard;
if (window.__holmLeaderboard) setLeaderboard(window.__holmLeaderboard);

// ------------------------------------------------------------------ game state
let state = 'title', paused = false, frame = 0, stateT = 0, boardFrom = 'title', boardTab = 0;
let camX = 0, shake = 0, score = 0, lives = 3, coinsGot = 0, newBest = false;
let platforms, coins, enemies, parts, floaters, genX;
const P = { x: 60, y: GROUND, vx: 0, vy: 0, face: 1, onGround: true, coyote: 0, buffer: 0, inv: 0, squash: 0, runT: 0, hurtT: 0 };
const PW = 16, PH = 18;                           // hitbox (feet-centred)

function reset() {
  platforms = []; coins = []; enemies = []; parts = []; floaters = [];
  genX = 150; score = 0; lives = 3; coinsGot = 0; newBest = false; camX = 0; shake = 0;
  Object.assign(P, { x: 60, y: GROUND, vx: 0, vy: 0, face: 1, onGround: true, coyote: 0, buffer: 0, inv: 0, squash: 0, runT: 0, hurtT: 0 });
  // friendly opener: a line of coins, then a fence
  for (let i = 0; i < 5; i++) addCoin(110 + i * 14, GROUND - 10);
  generate(camX + 700);
}
function addCoin(x, y) { coins.push({ x, y, ph: rnd() * 6, got: false }); }
function addPlat(type, x) {
  const im = img[type], p = { type, x, w: im.width, h: im.height, y: GROUND - im.height };
  if (type === 'mailbox') { p.y = GROUND - 28; p.hx = x + 1; p.hw = 12; } else { p.hx = x; p.hw = im.width; }
  if (type === 'fence') p.y = GROUND - 16;
  if (type === 'garage') p.y = GROUND - 40;
  platforms.push(p); return p;
}
function arc(x0, n, gap, y0, hgt) { for (let i = 0; i < n; i++) { const u = n > 1 ? i / (n - 1) : 0.5; addCoin(x0 + i * gap, y0 - Math.sin(u * Math.PI) * hgt); } }

function generate(until) {
  while (genX < until) {
    const d = Math.min(1, genX / 7000);
    const x = genX; let w = 0;
    const r = rnd();
    if (r < 0.16) { arc(x, 5, 14, GROUND - 10, 0); w = 90; }
    else if (r < 0.32) { arc(x, 5, 14, GROUND - 12, 34); w = 96; }
    else if (r < 0.52) {
      const n = ri(1, 3); for (let i = 0; i < n; i++) addPlat('fence', x + i * 40);
      arc(x + 8, n * 3, 13, GROUND - 28, n > 1 ? 10 : 0); w = n * 40 + 44;
    } else if (r < 0.7) {
      const n = ri(2, 3); for (let i = 0; i < n; i++) { addPlat('mailbox', x + i * 44); addCoin(x + i * 44 + 7, GROUND - 42); } w = n * 44 + 30;
    } else {
      addPlat('fence', x); const g = addPlat('garage', x + 50);
      arc(g.x + 8, 4, 13, g.y - 10, 0);
      if (rnd() < 0.6) arc(g.x + 4, 5, 12, g.y - 34, 10);
      w = 50 + g.w + 40;
    }
    // hazards, gently more frequent the further you go (never in the opener)
    if (x > 420 && rnd() < 0.3 + 0.35 * d) {
      if (rnd() < 0.55) enemies.push({ type: 'yarn', x: x + w + 40, y: GROUND - 12, w: 12, h: 12, vx: -(0.6 + 0.45 * d + rnd() * 0.2), active: false, rot: 0, dead: false });
      else { const by = rr(104, 132); enemies.push({ type: 'fud', x: x + rr(10, w), y: by, by, w: 24, h: 16, vx: -(0.2 + 0.25 * d), t: rnd() * 100, active: false, dead: false }); }
    }
    genX += w + ri(20, 50);
  }
}

// ------------------------------------------------------------------ particles / juice
function sparkle(x, y) {
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2 + rnd() * 0.3, s = rr(0.6, 1.5); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.3, life: ri(16, 26), max: 26, kind: 'spark', col: i % 2 ? '#ffffff' : '#7fa6ff' }); }
  parts.push({ x, y, vx: 0, vy: 0, life: 12, max: 12, kind: 'ring', col: '#ffffff' });
}
function dust(x, y, n = 4) { for (let i = 0; i < n; i++) parts.push({ x: x + rr(-6, 6), y: y - 1, vx: rr(-0.6, 0.6), vy: rr(-0.5, -0.1), life: ri(10, 18), max: 18, kind: 'dust', col: '#8a9ae8' }); }
function poof(x, y, col) { for (let i = 0; i < 10; i++) { const a = rnd() * Math.PI * 2, s = rr(0.4, 1.4); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: ri(14, 24), max: 24, kind: 'dust', col }); } }
function floatText(x, y, t, col) { floaters.push({ x, y, t, col, life: 40 }); }

// ------------------------------------------------------------------ update
let runStart = 0;
function startGame() { reset(); runStart = Date.now(); state = 'play'; stateT = 0; paused = false; sfx.start(); }
function hurt(fromX) {
  if (P.inv > 0) return;
  lives--; P.inv = 100; P.hurtT = 18; shake = 12; sfx.hit();
  P.vy = -2.6; P.vx = (P.x < fromX ? -1 : 1) * 2.2; P.onGround = false;
  for (let i = 0; i < 6; i++) parts.push({ x: P.x, y: P.y - 12, vx: rr(-1.5, 1.5), vy: rr(-2, -0.5), life: 20, max: 20, kind: 'dust', col: '#ff6d8a' });
  if (lives <= 0) {
    state = 'over'; stateT = 0; newBest = score > Math.max(best, lb.you ? lb.you.best : 0); if (score > best) { best = score; saveBest(); }
    sfx.over(); if (newBest) sfx.best();
    if (lb.enabled) lb.pending = true;              // rank shows '...' until the host answers
    try { window.dispatchEvent(new CustomEvent('holm:gameover', { detail: { score, coins: coinsGot, ms: Date.now() - runStart } })); } catch (_) {}
  }
}

function updatePlayer() {
  const l = held(LEFT) || touch.left, r = held(RIGHT) || touch.right, jh = held(JUMP) || touch.jump;
  const dir = (r ? 1 : 0) - (l ? 1 : 0);
  if (P.hurtT > 0) P.hurtT--;
  const acc = P.onGround ? 0.28 : 0.18, max = 1.7;
  if (dir && P.hurtT <= 0) { P.vx += dir * acc; P.face = dir; }
  else P.vx *= P.onGround ? 0.78 : 0.94;
  P.vx = Math.max(-max, Math.min(max, P.vx)); if (Math.abs(P.vx) < 0.03) P.vx = 0;
  if (jumpPressed) P.buffer = 8;
  if (P.buffer > 0) P.buffer--;
  if (P.onGround) P.coyote = 6; else if (P.coyote > 0) P.coyote--;
  if (P.buffer > 0 && P.coyote > 0) { P.vy = -4.7; P.onGround = false; P.coyote = 0; P.buffer = 0; sfx.jump(); dust(P.x, P.y, 3); }
  if (!jh && P.vy < -1.6) P.vy *= 0.6;          // variable jump height
  P.vy = Math.min(P.vy + 0.22, 4.2);
  const prevBottom = P.y;
  P.x += P.vx; P.y += P.vy;
  if (P.x < camX + 8) { P.x = camX + 8; P.vx = Math.max(0, P.vx); }
  const was = P.onGround; P.onGround = false;
  if (P.vy >= 0) {
    if (P.y >= GROUND) { P.y = GROUND; P.vy = 0; P.onGround = true; }
    for (const p of platforms) {
      if (P.x + PW / 2 - 2 > p.hx && P.x - PW / 2 + 2 < p.hx + p.hw && prevBottom <= p.y + 0.01 && P.y >= p.y) { P.y = p.y; P.vy = 0; P.onGround = true; }
    }
  }
  if (P.onGround && !was) { P.squash = 6; dust(P.x, P.y, 4); }
  if (P.squash > 0) P.squash--;
  if (P.onGround && Math.abs(P.vx) > 0.4) { P.runT++; if (P.runT % 14 === 0) dust(P.x - P.face * 6, P.y, 1); } else P.runT = 0;

function aabb(ax, ay, aw, ah, bx, by, bw, bh) { return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by; }

function updateWorld() {
  const px = P.x - PW / 2, py = P.y - PH;
  for (const c of coins) {
    if (c.got) continue; c.ph += 0.12;
    if (aabb(px, py, PW, PH, c.x - 5, c.y - 5, 10, 10)) {
      c.got = true; score += 10; coinsGot++; sparkle(c.x, c.y); floatText(c.x, c.y - 8, '+10', '#ffffff'); sfx.coin();
    }
  }
  for (const e of enemies) {
    if (e.dead) continue;
    if (!e.active && e.x - camX < W + 30) e.active = true;
    if (!e.active) continue;
    if (e.type === 'yarn') { e.x += e.vx; e.rot += -e.vx / 3; }
    else { e.t++; e.x += e.vx; e.y = e.by + Math.sin(e.t * 0.05) * 8; }
    const ex = e.type === 'yarn' ? e.x + 1 : e.x + 3, ey = e.type === 'yarn' ? e.y + 1 : e.y + 3, ew = e.w - (e.type === 'yarn' ? 2 : 6), eh = e.h - (e.type === 'yarn' ? 2 : 6);
    if (aabb(px + 2, py + 3, PW - 4, PH - 3, ex, ey, ew, eh)) {
      if (P.vy > 0.5 && P.y - P.vy <= ey + 5) {
        e.dead = true; P.vy = -3.6; P.onGround = false; score += 25; sfx.stomp();
        poof(e.x + e.w / 2, e.y + e.h / 2, e.type === 'yarn' ? '#ff8fbf' : '#a0a2b0');
        floatText(e.x + e.w / 2, e.y - 4, e.type === 'yarn' ? '+25' : 'FUD BUSTED +25', '#ffd76e');
      } else hurt(e.x + e.w / 2);
    }

}

function updateFx() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; if (p.kind === 'spark') { p.vx *= 0.92; p.vy = p.vy * 0.92 + 0.02; } else p.vy *= 0.95; p.life--; }

  for (const f of floaters) { f.y -= 0.4; f.life--; }
  floaters = floaters.filter(f => f.life > 0);
  if (shake > 0) shake--;
}

// menu hit boxes (canvas px)
const hit = (p, b) => !!p && p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h;
const BTN_TITLE_LB = { x: 96, y: 142, w: 128, h: 20 }, BTN_OVER_LB = { x: 192, y: 112, w: 80, h: 24 };
const TAB_BOX = [{ x: 14, y: 8, w: 144, h: 20 }, { x: 162, y: 8, w: 144, h: 20 }];
function openBoard() {
  boardFrom = state; state = 'board'; stateT = 0; boardTab = 0;
  try { window.dispatchEvent(new CustomEvent('holm:leaderboard-open')); } catch (_) {}
}
function closeBoard() { state = boardFrom; stateT = boardFrom === 'over' ? 30 : 0; }

function update() {
  frame++; stateT++;
  if (state === 'title') {
    camX += 0.5;
    if (stateT > 10 && lb.enabled && (boardKey || hit(tapAt, BTN_TITLE_LB))) openBoard();
    else if (anyPressed && stateT > 10) startGame();
  } else if (state === 'play') {
    if (paused) { if (anyPressed) paused = false; }
    else {
      updatePlayer(); updateWorld();
      const target = Math.max(0, P.x - 120 + P.face * 20);
      camX += (target - camX) * 0.08;
    }
  } else if (state === 'over') {
    camX += 0.3;
    if (stateT > 20 && lb.enabled && (boardKey || hit(tapAt, BTN_OVER_LB))) openBoard();
    else if (anyPressed && stateT > 45) startGame();
  } else if (state === 'board') {
    camX += 0.3;
    if (stateT > 8) {
      if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'].includes(lastKey)) boardTab ^= 1;
      else if (tapAt) { if (hit(tapAt, TAB_BOX[0])) boardTab = 0; else if (hit(tapAt, TAB_BOX[1])) boardTab = 1; else closeBoard(); }
      else if (boardKey || anyPressed) closeBoard();
    }
  }
  if (!paused) updateFx();
  jumpPressed = false; anyPressed = false; lastKey = null; tapAt = null; boardKey = false;
}

// ------------------------------------------------------------------ render
const TW = [];                                     // twinkle stars
for (let i = 0; i < 28; i++) { const x = ri(0, 319), y = ri(2, 92); if (Math.hypot(x - 291, y - 27) > 22) TW.push({ x, y, ph: rnd() * 6, sp: rr(0.03, 0.09) }); }
const FLIES = []; for (let i = 0; i < 14; i++) FLIES.push({ x: rr(0, 320), y: rr(122, 158), ph: rnd() * 6, a: rr(3, 9) });
let shoot = null;

function tile(im, factor, y, period) {
  period = period || im.width;
  let ox = -Math.floor(camX * factor) % period; if (ox > 0) ox -= period;
  for (let x = ox; x < W; x += period) ctx.drawImage(im, x, y);
}

function drawBackground() {
  ctx.drawImage(img.sky, 0, 0);
  for (const s of TW) { const k = 0.5 + 0.5 * Math.sin(frame * s.sp + s.ph); if (k > 0.35) { ctx.globalAlpha = k; ctx.fillStyle = '#dde6ff'; ctx.fillRect(s.x, s.y, 1, 1); if (k > 0.9) { ctx.globalAlpha = (k - 0.9) * 6; ctx.fillRect(s.x - 1, s.y, 3, 1); ctx.fillRect(s.x, s.y - 1, 1, 3); } } }
  ctx.globalAlpha = 1;
  if (!shoot && rnd() < 0.002) shoot = { x: rr(60, 260), y: rr(4, 30), t: 0 };
  if (shoot) { for (let j = 0; j < 9; j++) { ctx.globalAlpha = (1 - j / 9) * (1 - shoot.t / 20); ctx.fillStyle = '#eef3ff'; ctx.fillRect(Math.round(shoot.x - shoot.t * 3 + j * 2), Math.round(shoot.y + shoot.t * 1.4 - j), 1, 1); } ctx.globalAlpha = 1; if (++shoot.t > 20) shoot = null; }
  // blimp drifting across with the WE COME HOLM banner
  const bw = img.blimp.width, span = W + bw + 60;
  const bx = Math.round(W + 20 - ((frame * 0.12 + camX * 0.06) % span));
  ctx.drawImage(img.blimp, bx, 10 + Math.round(Math.sin(frame * 0.02) * 1.5));
  tile(img.hills, 0.12, 70);
  tile(img.town, 0.4, 40);
  ctx.fillStyle = 'rgba(2,4,40,0.22)'; ctx.fillRect(0, 40, W, H - 40);   // depth haze so gameplay pops
  // fireflies over the lawn (in town-layer space)
  for (const f of FLIES) { const k = 0.5 + 0.5 * Math.sin(frame * 0.05 + f.ph * 3); if (k < 0.4) continue; let x = (f.x + Math.sin(frame * 0.013 + f.ph) * f.a - camX * 0.4) % 320; if (x < 0) x += 320; ctx.globalAlpha = k; ctx.fillStyle = '#e6ff8c'; ctx.fillRect(Math.round(x), Math.round(f.y + Math.sin(frame * 0.021 + f.ph) * 3), 1, 1); }
  ctx.globalAlpha = 1;
}

function drawGround(cx) {
  let ox = -Math.floor(cx) % 32; if (ox > 0) ox -= 32;
  for (let x = ox; x < W; x += 32) ctx.drawImage(img.walk, x, GROUND);
}

function drawDoji(x, y, face, alpha) {
  // EXACT sprite; only horizontal flip, 1px bob, 1px squash (nearest-neighbour)
  const im = img.doji, sw = im.width, sh = im.height;
  let bob = 0, squash = 0;
  if (P.squash > 0 && state === 'play') squash = 1;
  else if (P.runT > 0 && Math.floor(P.runT / 7) % 2) bob = -1;
  const dh = sh - squash;
  const dy = Math.round(y) - dh + bob;
  ctx.globalAlpha = alpha;
  if (face > 0) { const dx = Math.round(x) - 16; ctx.save(); ctx.translate(dx + sw, dy); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0, sw, sh, 0, 0, sw, dh); ctx.restore(); }
  else { const dx = Math.round(x) - 15; ctx.drawImage(im, 0, 0, sw, sh, dx, dy, sw, dh); }
  ctx.globalAlpha = 1;
}

function shadowAt(x, y, w) { ctx.fillStyle = 'rgba(0,0,30,0.35)'; ctx.fillRect(Math.round(x - w / 2), Math.round(y) - 1, w, 2); ctx.fillRect(Math.round(x - w / 2) + 2, Math.round(y) - 2, w - 4, 1); }

function drawWorld() {
  const cx = Math.round(camX);
  drawGround(cx);
  for (const p of platforms) { const x = Math.round(p.x - cx); if (x > W || x + p.w < 0) continue; ctx.fillStyle = 'rgba(0,0,30,0.45)'; ctx.fillRect(x + 1, GROUND, p.w - 1, 2); ctx.drawImage(img[p.type], x, GROUND - p.h); }
  for (const c of coins) {
    const x = Math.round(c.x - cx), y = Math.round(c.y + Math.sin(c.ph * 0.5) * 1.2);

  }
  for (const e of enemies) {
    const x = Math.round(e.x - cx), y = Math.round(e.y); if (x > W + 30 || x < -30) continue;
    if (e.type === 'yarn') {
      shadowAt(x + 6, GROUND, 10);
      const fr = ((Math.floor(e.rot) % 4) + 4) % 4; ctx.drawImage(img.yarn, fr * 12, 0, 12, 12, x, y, 12, 12);
      ctx.fillStyle = '#ff8fbf'; const tx = x + 12; ctx.fillRect(tx, GROUND - 1, 3, 1); ctx.fillRect(tx + 3, GROUND - 2, 3, 1);
    } else {
      const fr = Math.floor(e.t / 20) % 2; ctx.drawImage(img.fud, fr * 24, 0, 24, 16, x, y, 24, 16);
      if (e.t % 50 < 25) { ctx.fillStyle = '#8f93a8'; for (let k = 0; k < 3; k++) { const dx = x + 5 + k * 6, dy = y + 16 + ((e.t + k * 7) % 14); if (dy < GROUND - 1) ctx.fillRect(dx, dy, 1, 2); } }
    }
  }
  if (state === 'play' || state === 'over' || (state === 'board' && boardFrom === 'over')) {
    shadowAt(P.x - cx, P.onGround ? P.y : groundBelow(), 18);
    const blink = P.inv > 0 && Math.floor(P.inv / 4) % 2 === 0;
    drawDoji(P.x - cx, P.y, P.face, blink ? 0.25 : 1);
  }
  for (const p of parts) {
    const x = Math.round(p.x - cx), y = Math.round(p.y), k = p.life / p.max;
    ctx.fillStyle = p.col; ctx.globalAlpha = Math.min(1, k * 1.5);
    if (p.kind === 'ring') { const r = Math.round((1 - k) * 10) + 3; ctx.fillRect(x - r, y, 2, 1); ctx.fillRect(x + r - 1, y, 2, 1); ctx.fillRect(x, y - r, 1, 2); ctx.fillRect(x, y + r - 1, 1, 2); }
    else if (p.kind === 'spark' && k > 0.5) { ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); }

}
function groundBelow() { let g = GROUND; for (const p of platforms) if (P.x > p.hx && P.x < p.hx + p.hw && p.y >= P.y - 0.01 && p.y < g) g = p.y; return g; }

function drawHUD() {

  text(String(score).padStart(5, '0'), 20, 7, '#ffffff');

function onBase(cx, y) {
  const s = 'ON BASE', tw = s.length * 8 + 13, x = Math.round(cx - tw / 2);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y - 1, 9, 9); ctx.fillStyle = '#0000ff'; ctx.fillRect(x + 2, y + 1, 5, 5);

}

function dim(a) { ctx.fillStyle = `rgba(0,0,40,${a})`; ctx.fillRect(0, 0, W, H); }

function drawTitle() {

  onBase(W / 2, ty + img.title.height + 4);

function drawOverClassic() {
  ctx.fillStyle = 'rgba(0,2,40,0.72)'; ctx.fillRect(70, 28, 180, 128); ctx.fillStyle = '#2a4cff'; ctx.fillRect(70, 28, 180, 1); ctx.fillRect(70, 155, 180, 1);
  text('GAME OVER', W / 2, 38, '#ff8fb0', '#3a0018', 'center');
  text('SCORE ' + score, W / 2, 62, '#ffffff', '#001a66', 'center');
  text('BEST  ' + best, W / 2, 76, '#8fb0ff', '#001a66', 'center');
  if (newBest && Math.floor(frame / 12) % 2 === 0) text('NEW BEST!', W / 2, 92, '#ffd76e', '#3a1a00', 'center');
  // "Play again" button
  const bw = 112, bx = (W - bw) / 2, by = 110;
  ctx.fillStyle = '#000a60'; ctx.fillRect(bx + 2, by + 2, bw, 18);
  ctx.fillStyle = stateT > 45 && Math.floor(frame / 20) % 2 ? '#2a5cff' : '#0000ff'; ctx.fillRect(bx, by, bw, 18);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(bx, by, bw, 1); ctx.fillRect(bx, by + 17, bw, 1); ctx.fillRect(bx, by, 1, 18); ctx.fillRect(bx + bw - 1, by, 1, 18);
  text('PLAY AGAIN', W / 2, by + 5, '#ffffff', '#000a60', 'center');
  text(document.body.classList.contains('touch') ? 'TAP' : 'SPACE / ENTER', W / 2, by + 26, '#9aa8e0', null, 'center');
  ctx.drawImage(img.tag, 5, H - img.tag.height - 3);
}

const isTouch = () => document.body.classList.contains('touch');
const MEDAL = ['#ffd76e', '#e4ebff', '#ffb27a'];
const fit = (s, n) => (s.length > n ? s.slice(0, n - 1).trimEnd() + '.' : s);
function wrap(s, n) { if (s.includes('|')) return s.split('|').flatMap(part => wrap(part.trim(), n)); const out = []; let line = ''; for (const w of s.split(' ')) { const t = line ? line + ' ' + w : w; if (t.length <= n) line = t; else { if (line) out.push(line); line = fit(w, n); } } if (line) out.push(line); return out; }
function panel(x, y, w, h) { ctx.fillStyle = 'rgba(0,2,40,0.84)'; ctx.fillRect(x, y, w, h); ctx.fillStyle = '#2a4cff'; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); }
function button(label, cx, y, w, h, hot) {
  const x = Math.round(cx - w / 2);
  ctx.fillStyle = '#000a60'; ctx.fillRect(x + 2, y + 2, w, h);
  ctx.fillStyle = hot ? '#2a5cff' : '#0000ff'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
  text(label, cx, y + Math.floor((h - 8) / 2), '#ffffff', '#000a60', 'center');
}
const lbList = tab => (tab ? lb.week : lb.top);
const lbMe = tab => (tab ? lb.weekYou : lb.you);
const isMeRow = (r, me) => r.me || (!!me && me.rank === r.rank);
// one ranked row: rank right-aligned ending at xr, name from xn (n chars), score right-aligned at xs
function lbRow(r, y, xr, xn, n, xs, me) {
  const mine = isMeRow(r, me);
  if (mine) { ctx.fillStyle = '#0000ff'; ctx.fillRect(xr - 20, y - 2, xs - xr + 23, 11); }
  text(String(r.rank), xr, y, r.rank <= 3 ? MEDAL[r.rank - 1] : '#9aa8e0', '#001a66', 'right');
  text(fit(r.name, n), xn, y, mine ? '#ffd76e' : '#ffffff', '#001a66');
  text(String(r.score), xs, y, mine ? '#ffd76e' : '#8fb0ff', '#001a66', 'right');
}
function lbEmptyLines() {
  if (lb.status === 'loading' || lb.pending) return ['LOADING...'];
  if (lb.status === 'error') return ['LEADERBOARD', 'OFFLINE'];
  return ['NO SCORES YET', 'BE THE FIRST!'];
}
function lbNote() {               // why this run is not ranked (practice / error), host text wins
  if (lb.message) return lb.message;
  if (lb.status === 'practice') return 'PRACTICE RUN|NOT RANKED|PLAY VIA BOT';
  if (lb.status === 'error') return 'SCORE NOT SAVED|TRY AGAIN';
  return '';
}
const rankStr = me => (lb.pending || lb.status === 'loading' ? '...' : me && me.rank ? '#' + me.rank : '--');

function drawOver() {
  dim(0.45);
  if (!lb.enabled) { drawOverClassic(); return; }
  panel(8, 6, 304, 154);
  text('GAME OVER', W / 2, 11, '#ff8fb0', '#3a0018', 'center');
  ctx.fillStyle = '#2a4cff'; ctx.fillRect(16, 23, 288, 1); ctx.fillRect(141, 29, 1, 76);
  // left column: this run
  const L = 18, R = 134, shownBest = Math.max(best, lb.you ? lb.you.best : 0), flash = Math.floor(frame / 12) % 2 === 0;
  text('SCORE', L, 32, '#9aa8e0', null); text(String(score), R, 32, '#ffffff', '#001a66', 'right');
  if (newBest) text('NEW BEST!', L, 46, flash ? '#ffd76e' : '#ffb27a', '#3a1a00'); else text('BEST', L, 46, '#9aa8e0', null);
  text(String(shownBest), R, 46, '#8fb0ff', '#001a66', 'right');
  text('RANK', L, 60, '#9aa8e0', null); text(rankStr(lb.you), R, 60, lb.you && lb.you.rank && lb.you.rank <= 3 ? MEDAL[lb.you.rank - 1] : '#ffffff', '#001a66', 'right');
  text('WEEK', L, 74, '#9aa8e0', null); text(rankStr(lb.weekYou), R, 74, '#ffffff', '#001a66', 'right');
  wrap(lbNote(), 15).slice(0, 3).forEach((ln, i) => text(ln, (L + R) / 2, 87 + i * 9, '#ff8fb0', null, 'center'));
  // right column: top 5, alternating all-time / this week when both exist
  const tab = lb.week.length && lb.top.length ? Math.floor(stateT / 240) % 2 : (lb.top.length ? 0 : lb.week.length ? 1 : 0);
  const rows = lbList(tab).slice(0, 5), me = lbMe(tab), cx = 226;
  text(tab ? 'THIS WEEK TOP 5' : 'ALL-TIME TOP 5', cx, 32, '#ffd76e', '#3a1a00', 'center');
  if (!rows.length) lbEmptyLines().forEach((ln, i) => text(ln, cx, 56 + i * 12, '#9aa8e0', null, 'center'));
  rows.forEach((r, i) => lbRow(r, 46 + i * 11, 166, 172, 9, 302, me));
  if (rows.length && me && me.rank > 5) {   // your own line under the top 5
    ctx.fillStyle = '#0000ff'; ctx.fillRect(146, 100, 159, 11);
    text('YOU #' + me.rank, 150, 102, '#ffd76e', '#001a66'); text(String(me.best), 302, 102, '#ffd76e', '#001a66', 'right');
  }
  // buttons
  button('PLAY AGAIN', 110, 116, 112, 18, stateT > 45 && Math.floor(frame / 20) % 2);
  button('BOARD', 232, 116, 72, 18, false);
  text(isTouch() ? 'TAP TO PLAY AGAIN' : 'SPACE PLAY  L BOARD', W / 2, 144, '#9aa8e0', null, 'center');
  ctx.drawImage(img.tag, 5, H - img.tag.height - 3);
}

function drawBoard() {
  dim(0.6);
  panel(8, 4, 304, 160);
  ['ALL TIME', 'THIS WEEK'].forEach((lbl, i) => {
    const b = TAB_BOX[i], on = boardTab === i, x = b.x + 2, y = b.y + 2, w = b.w - 4, h = 14;
    ctx.fillStyle = on ? '#0000ff' : '#000a60'; ctx.fillRect(x, y, w, h);
    if (on) { ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h); }
    text(lbl, b.x + b.w / 2, y + 3, on ? '#ffffff' : '#7f8fd0', on ? '#000a60' : null, 'center');
  });
  const rows = lbList(boardTab), me = lbMe(boardTab);
  if (!rows.length) lbEmptyLines().forEach((ln, i) => text(ln, W / 2, 60 + i * 14, '#9aa8e0', null, 'center'));
  rows.forEach((r, i) => lbRow(r, 30 + i * 10, 36, 44, 22, 302, me));
  ctx.fillStyle = '#2a4cff'; ctx.fillRect(16, 130, 288, 1);
  if (me && (me.rank || me.best)) {
    text('YOU ' + (me.rank ? '#' + me.rank : '--'), 20, 135, '#ffd76e', '#3a1a00');
    text('BEST ' + me.best, 302, 135, '#ffd76e', '#3a1a00', 'right');
  } else {
    const note = lb.status === 'practice' && !lb.message ? 'PRACTICE MODE - PLAY VIA THE BOT' : lb.status === 'error' && !lb.message ? 'LEADERBOARD OFFLINE - TRY LATER' : lbNote() || (lb.status === 'ok' ? 'NOT RANKED YET - PLAY A RUN!' : '');
    if (note) text(fit(note.replace(/\|/g, ' '), 36), W / 2, 135, '#ff8fb0', null, 'center');
  }
  text(isTouch() ? 'TAP A TAB TO SWITCH  TAP TO CLOSE' : '< > SWITCH   SPACE/ESC CLOSE', W / 2, 150, '#7f8fd0', null, 'center');
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate(Math.round(rr(-1, 1) * shake / 4), Math.round(rr(-1, 1) * shake / 4));
  drawBackground();
  drawWorld();
  ctx.restore();
  if (state === 'play') { drawHUD(); if (paused) { dim(0.5); text('PAUSED', W / 2, 80, '#ffffff', '#001a66', 'center'); text('PRESS ANY KEY', W / 2, 96, '#9aa8e0', null, 'center'); } }
  else if (state === 'title') drawTitle();
  else if (state === 'board') drawBoard();
  else drawOver();
}

// ------------------------------------------------------------------ loop (fixed 60 Hz step)
let last = 0, accT = 0;
function loop(t) {
  if (!last) last = t;
  accT += Math.min(100, t - last); last = t;
  let n = 0; while (accT >= 1000 / 60 && n < 5) { update(); accT -= 1000 / 60; n++; }
  render();
  requestAnimationFrame(loop);
}
loadAll(() => { reset(); requestAnimationFrame(loop); });
window.__holm = { get state() { return state; }, get score() { return score; }, get lives() { return lives; }, P, lb };
})();

</script>

<script>
/* v13b: Telegram's Mini App script loads ONLY inside a Mini App (launch hash has tgWebAppData).
   In a Telegram *game* (group /play) Telegram Android opens its Share sheet for every event that
   script sends (ready, expand, theme, viewport...), which buried the game and ate the controls. */
(function () {
  var mini = false;
  try { mini = /tgWebAppData=/.test(location.hash) || /tgWebAppData/.test(sessionStorage.getItem("__telegram__initParams") || ""); } catch (_) {}
  if (!mini) return;
  var s = document.createElement("script");
  s.src = "https://telegram.org/js/telegram-web-app.js";
  s.onload = function () {
    try { var w = window.Telegram && Telegram.WebApp; if (w) { w.ready(); w.expand(); if (w.disableVerticalSwipes) w.disableVerticalSwipes(); } } catch (_) {}
  };
  document.head.appendChild(s);
})();
</script>
<script>
/* HOLM Coin Run bridge. Posts to the existing HOLM board only (/api/score, /api/leaderboard). */
(() => {
  const API_ORIGIN = "https://home-1--juliantaguilar0.replit.app";
  const api = (path) => (location.hostname.endsWith("replit.app") ? path : API_ORIGIN + path);
  const tgHere = () => {
    try { return (window.Telegram && window.Telegram.WebApp) || null; } catch (_) { return null; }
  };
  try {
    const tg = tgHere();
    if (tg) { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }
  } catch (_) {}
  const initData = () => {
    const here = tgHere();
    if (here && here.initData) return here.initData;
    try {
      if (window.parent && window.parent !== window) {
        const pt = window.parent.Telegram && window.parent.Telegram.WebApp;
        if (pt && pt.initData) return pt.initData;
      }
    } catch (_) {}
    return "";
  };
  const lt = () => { try { return sessionStorage.getItem("verse_lt") || ""; } catch (_) { return ""; } };
  const push = (d) => (window.holmSetLeaderboard ? window.holmSetLeaderboard(d) : (window.__holmLeaderboard = Object.assign(window.__holmLeaderboard || {}, d)));
  const rows = (a) => (Array.isArray(a) ? a : []).slice(0, 10).map((r, i) => ({ rank: r.rank || i + 1, name: r.name, score: r.score, me: !!r.me }));
  const you = (p) => (p ? { rank: p.rank, best: p.best != null ? p.best : p.score } : null);
  const fromApi = (d) => ({
    top: rows((d.all_time && d.all_time.top10) || d.top10),
    you: you((d.all_time && d.all_time.player) || d.player),
    week: rows(d.weekly && d.weekly.top10),
    weekYou: you(d.weekly && d.weekly.player)
  });
  const readJson = async (r) => { try { return JSON.parse(await r.text()); } catch (_) { return {}; } };
  let seq = 0;
  async function refresh(extra) {
    const run = ++seq;
    const data = initData();
    const headers = data ? { "X-Telegram-Init-Data": data } : {};
    if (!data && lt()) headers["X-Verse-Launch-Token"] = lt();
    const idle = (data || lt()) ? "ok" : "practice";
    try {
      const r = await fetch(api("/api/leaderboard"), { headers, cache: "no-store" });
      if (!r.ok) throw new Error("http " + r.status);
      const d = await readJson(r);
      if (run === seq) push(Object.assign(fromApi(d), { status: idle, message: "" }, extra || {}));
    } catch (_) {
      if (run === seq) push(Object.assign({ status: "error", message: "LEADERBOARD OFFLINE" }, extra || {}));
    }
  }
  window.addEventListener("holm:leaderboard-open", () => refresh());
  window.addEventListener("holm:gameover", async (ev) => {
    const detail = ev.detail || {};
    const data = initData();
    if (!data && !lt()) { refresh({ status: "practice" }); return; }
    const run = ++seq;
    push({ status: "loading" });
    try {
      const r = await fetch(api("/api/score"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData: data, launchToken: data ? "" : lt(), score: detail.score, coins: detail.coins, ms: detail.ms })
      });
      const d = await readJson(r);
      if (run !== seq) return;
      if (r.ok && (d.top10 || d.all_time)) { push(Object.assign(fromApi(d), { status: "ok", message: "" })); return; }
      const msg = r.status === 401 ? "SESSION EXPIRED|REOPEN FROM BOT"
        : r.status === 429 ? "TOO FAST|SCORE NOT SAVED"
        : r.status === 422 || r.status === 400 ? "SCORE REJECTED"
        : "SCORE NOT SAVED|TRY AGAIN";
      refresh({ status: r.status === 401 ? "practice" : "error", message: msg });
    } catch (_) {
      if (run === seq) refresh({ status: "error", message: "OFFLINE|SCORE NOT SAVED" });
    }
  });
  refresh();
})();
</script>
