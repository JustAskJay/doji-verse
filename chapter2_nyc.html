<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DOJI VERSE - Brian's Story</title>
<link rel="icon" href="data:,">
<style>
  /* Press Start 2P, SIL OFL 1.1 (fonts/OFL.txt). Subset, bundled, no network. */
  @font-face {
    font-family: "Pix";
    src: url("fonts/PressStart2P.woff") format("woff");
    font-display: block;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #07060c;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  html { touch-action: none; }
  body {
    /* Pinned: no rubber-band scroll, no jump when iOS shows or hides its bars. */
    position: fixed;
    inset: 0;
    touch-action: manipulation;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  /* Every part of the handheld: no zoom, no double-tap zoom, no callout, no text pick. */
  #device, #device *, #prompt, #say {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) and (pointer: fine) {
    body { align-items: center; }
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }

  /* ---------- NINTENDOJI GAME BOI (COLOUR-ISH) ----------
     A bootleg handheld. Screen on top, HUD in the black bezel,
     Controls sit like a real Game Boy: D-pad left, A/B right (B lower-left, A upper-right).
     Every size comes from JS fit(): --sw/--sh are the exact integer-scaled
     screen size, --k is the HUD text scale, --ctl is the control size. */
  #device {
    --sw: 320px;
    --sh: 180px;
    --k: 1;
    --ctl: 120px;
    --bz: 10px;
    --sp: 12px;
    box-sizing: border-box;
    padding: max(var(--dp, 8px), env(safe-area-inset-top)) var(--dp, 8px) max(var(--dp, 8px), env(safe-area-inset-bottom));
    filter: drop-shadow(0 5px 0 #000);
    transform-origin: 50% 0;
  }
  #device.nofoot #foot { display: none; }
  #shell {
    position: relative;
    box-sizing: border-box;
    width: calc(var(--sw) + 2 * var(--bz) + 2 * var(--sp));
    padding: var(--sp) var(--sp) calc(var(--sp) + 6px);
    background: #0000aa;
    box-shadow:
      inset 4px 4px 0 #2b2bff,
      inset -4px -4px 0 #00006a;
    color: #9fd0ff;
    font-family: "Pix", ui-monospace, "Courier New", monospace;
    font-size: calc(8px * var(--k));
    line-height: 1;
    display: flex;
    flex-direction: column;
  }
  #pads { flex: 1 1 auto; }
  #bezel {
    position: relative;
    box-sizing: border-box;
    padding: calc(7px * var(--k)) var(--bz) calc(10px * var(--k));
    background: #07060c;
    box-shadow:
      inset 0 0 0 2px #1d1b30,
      inset 3px 3px 0 2px #000;
  }
  .tagline {
    display: flex;
    align-items: center;
    gap: calc(4px * var(--k));
    margin: 0 0 calc(6px * var(--k));
    color: #6e7fb0;
    white-space: nowrap;
  }
  .tagline b {
    flex: 1 1 auto;
    height: calc(2px * var(--k));
    background: #953359;
    box-shadow: 0 calc(3px * var(--k)) 0 #2b2bff;
    margin-bottom: calc(3px * var(--k));
  }
  .tagline span { flex: 0 0 auto; }
  /* HUD rows live in the black bezel, above and under the screen. */
  #hud-top, #hud-bot {
    display: grid;
    gap: calc(5px * var(--k));
  }
  #hud-top { margin: 0 0 calc(7px * var(--k)); position: relative; }
  /* QUEST STARTED / UPDATED / COMPLETE banner over the top panel. */
  #hud-toast {
    position: absolute;
    left: calc(-4px * var(--k));
    right: calc(-4px * var(--k));
    top: 50%;
    z-index: 3;
    height: calc(18px * var(--k));
    margin-top: calc(-9px * var(--k));
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0000ff;
    color: #ffecd2;
    box-shadow: inset 0 0 0 calc(2px * var(--k)) #9fd0ff, 0 calc(2px * var(--k)) 0 #000;
    white-space: nowrap;
    pointer-events: none;
  }
  #hud-toast[hidden] { display: none; }
  #hud-toast.go { animation: toastin 2.4s linear forwards; }
  @keyframes toastin {
    0% { transform: scaleY(0); }
    5% { transform: scaleY(1); background: #0000ff; color: #ffecd2; }
    10% { background: #ffecd2; color: #0000ff; }
    15% { background: #0000ff; color: #ffecd2; }
    20% { background: #ffecd2; color: #0000ff; }
    25% { background: #0000ff; color: #ffecd2; }
    92% { transform: scaleY(1); }
    100% { transform: scaleY(0); }
  }
  #hud-bot { margin: calc(7px * var(--k)) 0 0; padding-left: calc(10px * var(--k)); }
  .hrow {
    display: flex;
    align-items: center;
    gap: calc(6px * var(--k));
    min-height: calc(8px * var(--k));
    white-space: nowrap;
    overflow: hidden;
  }
  .hk { flex: 0 0 auto; color: #5d6fa6; }
  .hv { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #e8f4ff; }
  #led {
    flex: 0 0 auto;
    width: calc(6px * var(--k));
    height: calc(6px * var(--k));
    background: #ff4056;
    box-shadow: 0 0 0 calc(1px * var(--k)) #2a1218, 0 0 calc(6px * var(--k)) #ff4056;
  }
  #led.low { background: #5a1a24; box-shadow: 0 0 0 calc(1px * var(--k)) #2a1218; }
  /* v7: the power LED breathes slowly (0.25 Hz) and blinks once on save. */
  @keyframes ledBreathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
  #led { animation: ledBreathe 4s ease-in-out infinite; }
  #led.low { animation: none; }
  #led.save { animation: none; background: #ffd0d8; box-shadow: 0 0 0 calc(1px * var(--k)) #2a1218, 0 0 calc(10px * var(--k)) #ff8fa6; }
  #hud-loc { color: #ffecd2; text-align: right; }
  #hud-qname { color: #9fd0ff; }
  #hud-qstep { color: #e8f4ff; }
  #hud-pips { display: flex; gap: calc(2px * var(--k)); flex: 0 0 auto; }
  #hud-pips i {
    display: block;
    width: calc(6px * var(--k));
    height: calc(6px * var(--k));
    background: #1c2a44;
  }
  #hud-pips i.on { background: #9fd0ff; }
  #hud-pips i.now { background: #0000ff; box-shadow: inset 0 0 0 calc(1px * var(--k)) #9fd0ff; }
  #hud-hint { color: #8eabd0; }
  #hud-hint.hot { color: #ffecd2; }
  #hud-extra:empty { display: none; }
  #hud-extra { display: grid; gap: calc(5px * var(--k)); }
  #slots { display: flex; gap: calc(4px * var(--k)); flex: 0 0 auto; }
  #slots button {
    width: calc(20px * var(--k));
    height: calc(20px * var(--k));
    padding: 0;
    border: 0;
    border-radius: 0;
    background: #0b0f22;
    box-shadow: inset 0 0 0 calc(2px * var(--k)) #1d2a4c;
    color: #e8f4ff;
    font: inherit;
    font-size: calc(6px * var(--k));
    cursor: pointer;
    touch-action: manipulation;
  }
  #slots button.has { box-shadow: inset 0 0 0 calc(2px * var(--k)) #9fd0ff; }
  #slots button.on { background-color: #0000ff; box-shadow: inset 0 0 0 calc(2px * var(--k)) #ffffff; }
  #slots button.hat {
    background-repeat: no-repeat;
    background-position: center;
    background-size: calc(16px * var(--k)) calc(10px * var(--k));
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #slots button.hat.off { opacity: 0.5; filter: saturate(0.4); }
  #slots button.fresh { animation: slotpop 0.6s steps(4) 2; }
  @keyframes slotpop { 50% { background-color: #ffecd2; } }
  .hrow.flash .hv { animation: rowflash 0.5s steps(2) 3; }
  @keyframes rowflash { 50% { color: #ffecd2; } }

  /* The screen. Exact integer-scaled 320x180, never stretched. */
  #screen {
    position: relative;
    width: var(--sw);
    height: var(--sh);
    margin: 0 auto;
    background: #07060c;
    box-shadow: 0 0 0 2px #000, 0 0 0 4px #1d1b30;
    overflow: hidden;
  }
  #screen > canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: #07060c;
  }
  #start {
    position: absolute;
    inset: 0;
    z-index: 4;
    background: #07060c;
  }
  #start[hidden] { display: none !important; }
  #title-scene {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: #07060c;
  }
  #start .sr, .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  #fade {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: #000;
    opacity: 1;
    pointer-events: none;
    transition: opacity 0.8s linear;
  }
  #fade[hidden] { display: none; }
  #fade.go { opacity: 0; }
  #fade.quick { transition-duration: 0.35s; }
  #pause {
    position: absolute;
    inset: 0;
    z-index: 6;
    box-sizing: border-box;
    padding: calc(8px * var(--pk, 1)) calc(10px * var(--pk, 1));
    background: rgba(4, 6, 18, 0.94);
    color: #e8f4ff;
    font-family: "Pix", ui-monospace, monospace;
    font-size: calc(8px * var(--pk, 1));
    line-height: 1;
    overflow: hidden;
  }
  #pause[hidden] { display: none; }
  #pause h2 {
    margin: 0 0 calc(8px * var(--pk, 1));
    font: inherit;
    color: #ffecd2;
    display: flex;
    justify-content: space-between;
  }
  #pause .sec { margin: 0 0 calc(8px * var(--pk, 1)); }
  #pause .sec > div { margin: 0 0 calc(5px * var(--pk, 1)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pause .k { color: #5d6fa6; }
  #pause .done { color: #5d6fa6; }
  #pause .now { color: #9fd0ff; }
  #pause .row { display: flex; gap: calc(6px * var(--pk, 1)); margin: 0 0 calc(5px * var(--pk, 1)); white-space: nowrap; }
  #pause .opt { color: #8eabd0; cursor: pointer; }
  #pause .opt.sel { color: #ffecd2; }
  #pause .opt b { font-weight: normal; color: #9fd0ff; }
  #pause .opts > div { margin-bottom: calc(6px * var(--pk, 1)); }
  #pause .cur { display: inline-block; width: calc(9px * var(--pk, 1)); color: #faef9b; }
  #pause .sel .cur { animation: curBounce 0.6s steps(2, jump-none) infinite; }
  @keyframes curBounce { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(calc(2px * var(--pk, 1))); } }
  #pause .legend { position: absolute; left: calc(10px * var(--pk, 1)); right: calc(10px * var(--pk, 1)); bottom: calc(8px * var(--pk, 1)); color: #8eabd0; white-space: nowrap; overflow: hidden; }
  /* v14: START menu scales to any number of quests. Fixed header + NOW box, one scrolling list, options pinned at the bottom. */
  #pause.v14 { display: flex; flex-direction: column; }
  #pause.v14[hidden] { display: none; }
  #pause.v14 h2, #pause.v14 .nowbox, #pause.v14 .qbar, #pause.v14 .row, #pause.v14 .legend { flex: 0 0 auto; }
  #pause.v14 .legend { position: static; margin-top: calc(3px * var(--pk, 1)); }
  #pause .nowbox { border: calc(1px * var(--pk, 1)) solid #2c3a6e; padding: calc(3px * var(--pk, 1)) calc(4px * var(--pk, 1)) 0; margin: 0 0 calc(4px * var(--pk, 1)); }
  #pause .nowbox > div, #pause .qlist > div { margin: 0 0 calc(4px * var(--pk, 1)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pause .nowbox .nk { color: #faef9b; }
  #pause .qlist { flex: 1 1 auto; min-height: 0; overflow: hidden; touch-action: none; }
  #pause .qlist .k { color: #faef9b; }
  #pause.v14 .row { margin-top: auto; }
  #pause .qlist .ind { padding-left: calc(8px * var(--pk, 1)); }
  #pause .qbar { display: flex; justify-content: space-between; color: #5d6fa6; margin: 0 0 calc(4px * var(--pk, 1)); white-space: nowrap; }
  #pause .qbar .on { color: #faef9b; }
  #pause.v14 .row { display: grid; grid-template-columns: 1fr 1fr; row-gap: calc(4px * var(--pk, 1)); }
  #pause.charsv { padding: 0; }
  #pause .charscv { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }

  /* Brand plate. */
  #brand {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: calc(4px * var(--k)) calc(8px * var(--k));
    margin: calc(10px * var(--k)) 2px 0;
    color: #9fd0ff;
  }
  #brand .maker {
    padding: calc(3px * var(--k)) calc(5px * var(--k));
    box-shadow: inset 0 0 0 calc(2px * var(--k)) #9fd0ff;
    font-size: calc(8px * var(--k));
  }
  #brand .logo {
    color: #e8f4ff;
    font-size: calc(16px * var(--k));
    text-shadow: calc(2px * var(--k)) calc(2px * var(--k)) 0 #000066;
    letter-spacing: 0;
  }
  #brand .tm { font-size: calc(8px * var(--k)); color: #5d6fa6; align-self: flex-start; }
  #brand .colour { font-size: calc(8px * var(--k)); white-space: nowrap; }
  #brand .colour i { font-style: normal; }

  /* Controls. Real Game Boy sides: D-pad on the LEFT, A/B on the RIGHT (A upper-right). */
  #pads {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: calc(var(--ctl) * 0.16) calc(var(--ctl) * 0.04) 0;
  }
  #ab {
    position: relative;
    width: calc(var(--ctl) * 1.18);
    height: calc(var(--ctl) * 0.95);
    flex: 0 0 auto;
  }
  #shell button { font-family: inherit; }
  .rb {
    position: absolute;
    width: calc(var(--ctl) * 0.46);
    height: calc(var(--ctl) * 0.46);
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .rb .cap {
    position: absolute;
    inset: 0;
    background: #953359;
    box-shadow:
      inset calc(var(--ctl) * 0.03) calc(var(--ctl) * 0.03) 0 #c4517f,
      inset calc(var(--ctl) * -0.03) calc(var(--ctl) * -0.03) 0 #5c1c38;
    pointer-events: none;
  }
  .rb .shadow {
    position: absolute;
    inset: 0;
    transform: translateY(calc(var(--ctl) * 0.04));
    background: #2a0c1c;
    pointer-events: none;
  }
  .rb.on .cap { transform: translateY(calc(var(--ctl) * 0.04)); background: #7a2848; box-shadow: inset calc(var(--ctl) * 0.02) calc(var(--ctl) * 0.02) 0 #5c1c38; }
  .rb .lbl {
    position: absolute;
    left: 50%;
    top: calc(100% + var(--ctl) * 0.07);
    transform: translateX(-50%);
    color: #9fd0ff;
    font-size: calc(8px * var(--k));
    pointer-events: none;
  }
  .rb .key {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffd6e6;
    font-size: calc(8px * var(--k));
    opacity: 0.55;
    pointer-events: none;
  }
  @media not ((hover: hover) and (pointer: fine)) { .rb .key { display: none; } }
  #btn-a { right: 0; top: 0; }
  #btn-b { left: 0; top: calc(var(--ctl) * 0.30); }
  #dpad {
    position: relative;
    width: var(--ctl);
    height: var(--ctl);
    flex: 0 0 auto;
    cursor: pointer;
    touch-action: none;
  }
  #dpad .arm, #dpad .hub, #dpad .base {
    position: absolute;
    pointer-events: none;
  }
  #dpad .base {
    inset: 0;
    transform: translateY(calc(var(--ctl) * 0.04));
    background:
      linear-gradient(#000033, #000033) 50% 50% / 34% 100% no-repeat,
      linear-gradient(#000033, #000033) 50% 50% / 100% 34% no-repeat;
  }
  #dpad .arm { background: #14122a; box-shadow: inset 3px 3px 0 #34315a, inset -3px -3px 0 #07060c; }
  #dpad .up    { left: 33%; top: 0;   width: 34%; height: 36%; }
  #dpad .down  { left: 33%; top: 64%; width: 34%; height: 36%; }
  #dpad .left  { left: 0;   top: 33%; width: 36%; height: 34%; }
  #dpad .right { left: 64%; top: 33%; width: 36%; height: 34%; }
  #dpad .hub   { left: 33%; top: 33%; width: 34%; height: 34%; background: #14122a; }
  #dpad .hub::after {
    content: "";
    position: absolute;
    left: 30%; top: 30%; width: 40%; height: 40%;
    background: #0b0a1a;
    box-shadow: inset 2px 2px 0 #07060c;
  }
  #dpad .arm.on { background: #0000ff; box-shadow: inset 3px 3px 0 #9fd0ff, inset -3px -3px 0 #0000aa; }
  #dpad .arm i {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 3px;
    height: 3px;
    transform: translate(-1.5px, -1.5px);
    background: #4a4778;
    color: #4a4778;
  }
  #dpad .arm.on i { background: #e8f4ff; color: #e8f4ff; }
  #dpad .up i    { box-shadow: 0 -3px 0 currentColor, -3px 0 0 currentColor, 3px 0 0 currentColor, -6px 3px 0 currentColor, 6px 3px 0 currentColor, 0 3px 0 transparent; }
  #dpad .down i  { box-shadow: 0 3px 0 currentColor, -3px 0 0 currentColor, 3px 0 0 currentColor, -6px -3px 0 currentColor, 6px -3px 0 currentColor; }
  #dpad .left i  { box-shadow: -3px 0 0 currentColor, 0 -3px 0 currentColor, 0 3px 0 currentColor, 3px -6px 0 currentColor, 3px 6px 0 currentColor; }
  #dpad .right i { box-shadow: 3px 0 0 currentColor, 0 -3px 0 currentColor, 0 3px 0 currentColor, -3px -6px 0 currentColor, -3px 6px 0 currentColor; }

  /* SELECT left, START right, like the real thing. */
  #pills {
    display: flex;
    justify-content: center;
    gap: calc(var(--ctl) * 0.28);
    margin: calc(var(--ctl) * 0.22) 0 0;
  }
  .pill {
    position: relative;
    width: calc(var(--ctl) * 0.40);
    height: calc(var(--ctl) * 0.12);
    min-height: 12px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    touch-action: none;
  }
  .pill .pcap {
    position: absolute;
    inset: 0;
    background: #000033;
    box-shadow: inset 2px 2px 0 #1c1c66, inset -2px -2px 0 #00001a;
    pointer-events: none;
  }
  .pill::before {
    /* Bigger hit area for thumbs. */
    content: "";
    position: absolute;
    inset: -10px -6px -18px;
  }
  .pill.on .pcap { transform: translateY(2px); background: #0000ff; box-shadow: inset 2px 2px 0 #9fd0ff; }
  .pill .lbl {
    position: absolute;
    left: 50%;
    top: calc(100% + 6px);
    transform: translateX(-50%);
    color: #9fd0ff;
    font-size: calc(8px * var(--k));
    white-space: nowrap;
    pointer-events: none;
  }
  #foot {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin: calc(var(--ctl) * 0.14) 0 0;
    min-height: calc(var(--ctl) * 0.38);
  }
  /* Speaker: six plain slanted slots, bottom-right. No pixel pattern. */
  #grille {
    display: flex;
    gap: calc(var(--ctl) * 0.075);
    align-items: center;
    height: calc(var(--ctl) * 0.38);
    /* Kept clear of the big rounded corner. */
    margin: 0 calc(var(--ctl) * 0.30) calc(var(--ctl) * 0.10) 0;
    transform: rotate(-28deg);
    transform-origin: 50% 50%;
  }
  #grille i {
    display: block;
    width: calc(var(--ctl) * 0.045);
    height: calc(var(--ctl) * 0.40);
    border-radius: calc(var(--ctl) * 0.03);
    background: #00004a;
    box-shadow: inset 1px 1px 0 #000030;
  }
  #sticker {
    color: #5d6fa6;
    font-size: calc(8px * var(--k));
    line-height: 1.5;
    text-align: left;
    white-space: nowrap;
  }
  #device.compact #brand { margin-top: calc(6px * var(--k)); }
  #device.compact #pills { margin-top: calc(var(--ctl) * 0.14); }
  #device.compact #foot { margin-top: calc(var(--ctl) * 0.08); }

  /* In-world prompt and speech stay as they were, positioned over the screen. */
  #prompt {
    position: fixed;
    z-index: 3;
    transform: translate(-50%, 0);
    margin: 0;
    padding: 0.35em 0.7em;
    border: 2px solid #9fd0ff;
    border-radius: 3px;
    background: rgba(6, 8, 22, 0.9);
    color: #e8f4ff;
    font: 700 14px/1 ui-monospace, "Courier New", monospace;
    letter-spacing: 0.02em;
    white-space: pre;
    cursor: pointer;
    touch-action: manipulation;
  }
  #prompt[hidden] { display: none; }
  #say {
    position: fixed;
    z-index: 3;
    transform: translate(-50%, -100%);
    margin: 0;
    padding: 0.35em 0.55em;
    border: 2px solid #9fd0ff;
    border-radius: 3px;
